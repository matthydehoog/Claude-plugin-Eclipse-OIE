name: Create Jira issue

# A new GitHub issue gets a Jira issue in this repository's Jira project (see .github/scripts/jira-issue.mjs).
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  jira:
    runs-on: ubuntu-latest
    # Skipped, instead of failing, until the repository is configured.
    if: vars.JIRA_PROJECT_KEY != ''
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Create the Jira issue and comment its key
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/jira-issue.mjs
